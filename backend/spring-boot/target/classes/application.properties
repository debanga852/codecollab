# Server configuration
server.port=8080

# CORS configuration (keep your existing DB config, just add these lines)
cors.allowed-origins=http://localhost:5174

# WebSocket
spring.web.socket.pool.size=1024
spring.web.socket.message.size-limit=1048576

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.codecollab=DEBUG

# Keep your existing database configuration below this line
# Database - USE 'postgres' as username
spring.datasource.url=jdbc:postgresql://localhost:5432/codecollab
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect