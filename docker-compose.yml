version: '3.8'

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: codecollab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codecollab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codecollab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Spring Boot REST API ───────────────────────────────────────────────────
  spring-boot:
    build:
      context: ./backend/spring-boot
      dockerfile: Dockerfile
    container_name: codecollab-spring
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/codecollab
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      cors.allowed-origins: "http://localhost:5174,http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Node.js Socket.io server ───────────────────────────────────────────────
  node-websocket:
    build:
      context: ./backend/cursor-websocket
      dockerfile: Dockerfile
    container_name: codecollab-ws
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"

  # ── React frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_SOCKET_URL: http://localhost:3001
    container_name: codecollab-frontend
    ports:
      - "3000:80"
    depends_on:
      - spring-boot
      - node-websocket

volumes:
  postgres-data:
  redis-data:
